name: Node.js CI (SAMS Backend)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # This checks your project can be required/loaded without crashing.
      - name: Smoke test (load server file)
        working-directory: backend
        run: node -e "require('./server.js'); console.log('Server file loads OK');"

      # Optional: run tests if you add them later
      # - name: Run tests
      #   working-directory: backend
      #   run: npm test
